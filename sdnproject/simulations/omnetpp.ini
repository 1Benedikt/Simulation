[General]
network = sdnproject.simulations.DatacenterCentralizedControl
sim-time-limit = 60s
repeat = 5

cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 5s
debug-on-errors = true
print-undisposed = false

**.scalar-recording = true
**.vector-recording = true
**.statistic-recording = true

# The controller is an abstraction of centralized network control. It does not
# model OpenFlow messages. Students implement the policy and decide how to
# actuate it, for example by selecting predefined paths, assigning clients to
# server replicas, changing routing weights, or reacting to failures.
*.controller.monitoringInterval = 1s
*.controller.congestionThreshold = 0.75
*.controller.minDecisionInterval = 2s
*.controller.demandFile = "simulations/demands.csv"

*.monitor[*].reportInterval = 1s
*.monitor[*].baseUtilization = 0.2
*.monitor[*].utilizationJitter = 0.1
*.monitor[*].baseQueueLength = 0
*.monitor[*].failed = false
*.monitor[0].monitoredNode = "core[0]"
*.monitor[1].monitoredNode = "core[1]"
*.monitor[2].monitoredNode = "aggregation[0]"
*.monitor[3].monitoredNode = "aggregation[1]"
*.monitor[4].monitoredNode = "aggregation[2]"
*.monitor[5].monitoredNode = "aggregation[3]"
*.monitor[6].monitoredNode = "edge[0]"
*.monitor[7].monitoredNode = "edge[1]"
*.monitor[8].monitoredNode = "edge[2]"
*.monitor[9].monitoredNode = "edge[3]"

# Basic host traffic.
**.host[*].numApps = 1
**.host[0..7].app[0].typename = "UdpBasicApp"
**.host[0..7].app[0].messageLength = 1200B
**.host[0..7].app[0].sendInterval = exponential(2ms)
**.host[0..7].app[0].startTime = uniform(1s, 2s)
**.host[0..7].app[0].stopTime = 58s
**.host[0..7].app[0].destPort = 5000
**.host[8..15].app[0].typename = "UdpSink"
**.host[8..15].app[0].localPort = 5000

[Config BaselineStatic]
description = "Baseline: static shortest-path or fixed assignment policy"
*.controller.strategy = "baseline"
**.host[0].app[0].destAddresses = "host[8]"
**.host[1].app[0].destAddresses = "host[9]"
**.host[2].app[0].destAddresses = "host[10]"
**.host[3].app[0].destAddresses = "host[11]"
**.host[4].app[0].destAddresses = "host[12]"
**.host[5].app[0].destAddresses = "host[13]"
**.host[6].app[0].destAddresses = "host[14]"
**.host[7].app[0].destAddresses = "host[15]"

[Config Dynamic]
description = "TODO: dynamic centralized-control strategy"
extends = BaselineStatic
*.controller.strategy = "dynamic"

[Config LinkFailure]
description = "Failure recovery scenario; adapt ScenarioManager path to your INET version"
extends = Dynamic
*.monitor[2].failed = true # simplified failure notification. 
# It does not disable a real link. The monitor simply tells the controller that a failure exists.

# Add a scenario manager from INET to simulaete different scenarios, for example:
# *.scenarioManager.script = xmldoc("failures/link_failure.xml")
